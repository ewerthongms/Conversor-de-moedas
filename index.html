<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <title>Conversor de Moedas</title>
</head>

<body>
    <div class="wrapper">
        <img src="./img/img-1.gif" alt="Logo1" class="Logo-1">
        <main class="main-div">
            <article class="article1">
                <label for="moeda-local">Converter  <b>de</b></label>
                <input type="text" placeholder="  R$ Real brasileiro" id="moeda-local">
            </article>
            <br>
            <article class="article2">
                <label for="moeda-ext">Converter para</label>
                <input type="text" placeholder="  US$ Dólar americano" id="moeda-ext">
            </article>
            <br>
            <article class="article3">
                <label for="valor-total">Valor</label class="label">
                <input type="text" placeholder="  R$ 10.000,00" id="valor-total">
            </article>
            <br>
            <Button class="button1">Converter</Button>
            <div class="div-pngs">
                <figure>
                    <img src="./img/brasil 2.png" alt="Bandeira1" class="Brasil">
                    <figcaption>Real</figcaption>
                    <p>R$ 10.000,00</p>
                </figure>
                <img src="./img/Vector.png" alt="vetor" class="Seta">
                <figure>
                    <img src="./img/estados-unidos (1) 1.png" alt="Bandeira2" class="EUA">
                    <figcaption>Dólar Americano</figcaption>
                    <p>US$ 2.000.00</p>
                </figure>


            </div>

        </main>







    </div>










    <script src="./Script.js"></script>
</body>

</html>
