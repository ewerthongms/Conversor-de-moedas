<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <title>Conversor de Moedas</title>
</head>

<body>
    <div class="wrapper">
        <img src="./assets/img/img-1.gif" alt="Logo1" class="Logo-1">
        <main class="main-div">
            <label for="Select1">Converter <b>de</b>
                <select name="Real Brasileiro" id="Select1">
                    <option value="R$ Real Brasileiro">R$ Real Brasileiro</option>
                </select>
            </label>

            <label for="Select2">Converter <b>para</b>
                <select name="Real Brasileiro" id="Select2" onchange="mudandoBandeiras()">
                    <option value="dolar">US$ Dólar americano</option>
                    <option value="euro">€ Euro</option>
                </select>
            </label>

            <label for="valor-total"><b>Valor</b></label class="label-valor">
            <input placeholder="R$ 10.000,00" id="valor-total">


            <Button onclick="convert()" class="button1">Converter</Button>


            <div class="div-pngs">
                <figure>
                    <img id="img1" src="./img/Brasil.png" alt="Bandeira1" class="Brasil">
                    <figcaption>Real</figcaption>
                    <p id="valor-a-converter"><b>R$ 0.00</b></p>
                </figure>
                <img src="./img/Vector.png" alt="vetor" class="Seta">
                <figure>
                    <img id="img3" src="./img/Eua.png" alt="Bandeira" class="EUA">
                    <figcaption id="currency-name">Dólar Americano </figcaption>
                    <p id="valor-convertido"><b>US$ 0.00</b></p>
                </figure>
            </div>


    </div>

    </main>







    </div>










    <script src="./Script.js"></script>
</body>

</html>
