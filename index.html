<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <title>Conversor de Moedas</title>
</head>

<body>
    <div class="wrapper">
        <img src="./img/img-1.gif" alt="Logo1" class="Logo-1">
        <main class="main-div">
            <label for="Select1">Converter <b>de</b>
                <select name="Real Brasileiro" id="Select1">
                    <option value="R$ Real Brasileiro">R$ Real Brasileiro</option>
                </select>
            </label>
            <label for="Select2">Converter <b>para</b>
                <select name="Real Brasileiro" id="Select2">
                    <option value="US$ Dólar americano">US$ Dólar americano</option>
                    <option value="Euro">Euro</option>
                </select>
            </label>
                <label for="valor-total"><b>Valor</b></label class="label-valor">
                <input type="number" placeholder="  R$ 10.000,00" id="valor-total">
            <Button onclick="convert()" class="button1">Converter</Button>
            <div class="div-pngs">
            <figure>
                <img id="img1" src="./img/brasil 2.png" alt="Bandeira1" class="Brasil">
                <img id="img2" src="./img/euro img.png" alt="bandeiraEuro" style="display: none;">
                <figcaption>Real</figcaption>
                <div id="pai"><b class="soueu">R$ 0.00</b></div>
            </figure>
            <img src="./img/Vector.png" alt="vetor" class="Seta">
            <figure>
                <img src="./img/estados-unidos (1) 1.png" alt="Bandeira2" class="EUA">
                <figcaption>Dólar Americano</figcaption>
                <p><b>US$ 0.00</b></p>
            </figure>
            </div>


    </div>

    </main>







    </div>










    <script src="./Script.js"></script>
</body>

</html>
